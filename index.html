<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐 굴리기 난이도표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #f4f5f7; --ink: #111; --accent: #2563eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #e6e8ec;
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }

  /* 상단 툴바 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(230, 232, 236, .94);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .toolbar, .tools {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    max-width: 1000px; margin: 0 auto; padding: 8px 12px;
  }
  .tools { padding-top: 0; }
  .toolbar .hint { flex: 1; min-width: 160px; font-size: 13px; color: #5b6170; line-height: 1.35; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: #fff; color: var(--ink); white-space: nowrap;
  }
  .btn.sm { padding: 7px 10px; font-size: 13px; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.danger { background: #fdecec; color: #c62828; }
  .btn:disabled { opacity: .5; cursor: progress; }

  .seg { display: inline-flex; background: #fff; border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent;
    padding: 6px 10px; border-radius: 8px; cursor: pointer; color: #4b5160; white-space: nowrap;
  }
  .seg button.on { background: var(--ink); color: #fff; }

  .swatches { display: inline-flex; gap: 5px; align-items: center; }
  .sw {
    width: 24px; height: 24px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid rgba(0,0,0,.15);
  }
  .sw.on { box-shadow: 0 0 0 2px #e6e8ec, 0 0 0 4px var(--ink); }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 12px 40px; }

  /* 시트: 원본 1568×2380 좌표계를 그대로 사용 */
  .sheet {
    container-type: inline-size;
    position: relative; width: 100%;
    aspect-ratio: 1568 / 2380;
    background: var(--bg);
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    overflow: hidden;
    --u: calc(100cqw / 1568);
  }
  .sheet > * { position: absolute; }
  #bg, #ink { left: 0; top: 0; width: 100%; height: 100%; }
  #ink { pointer-events: none; }
  .sheet[data-mode="pen"] #ink, .sheet[data-mode="erase"] #ink { pointer-events: auto; touch-action: none; cursor: crosshair; }
  .sheet[data-mode="text"] #ink { pointer-events: auto; cursor: text; }

  .photo {
    cursor: pointer; overflow: hidden; background: #fff;
    display: grid; place-items: center;
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo.has img { display: block; }
  .photo .plus { font-size: calc(var(--u) * 64); font-weight: 300; color: #d2d6dd; line-height: 1; user-select: none; }
  .photo.has .plus { display: none; }
  .photo:hover { background: #f8f9fb; }
  .photo.drag { box-shadow: inset 0 0 0 calc(var(--u) * 6) var(--accent); }
  .photo .del {
    position: absolute; top: 4px; right: 4px;
    width: clamp(18px, calc(var(--u) * 40), 28px); height: clamp(18px, calc(var(--u) * 40), 28px);
    border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: clamp(12px, calc(var(--u) * 26), 18px); line-height: 1;
    display: none;
  }
  .photo.has .del { display: grid; place-items: center; }
  @media (hover: hover) {
    .photo.has .del { opacity: 0; transition: opacity .15s; }
    .photo.has:hover .del { opacity: 1; }
  }

  .sheet input {
    border: 0; outline: 0; margin: 0; padding: 0; border-radius: 0;
    background: transparent; color: var(--ink);
    font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  .sheet input::placeholder { color: #c2c7cf; }
  .sheet input:focus { background: rgba(37, 99, 235, .07); }
  .name { text-align: center; font-weight: 500; font-size: calc(var(--u) * 26); }
  .sec { font-weight: 500; font-size: calc(var(--u) * 32); }
  .sheet input[readonly] { cursor: pointer; }

  /* 자유 글자 */
  .note {
    white-space: pre; line-height: 1.25; font-weight: 600;
    cursor: move; touch-action: none; user-select: none; -webkit-user-select: none;
    border-radius: 4px;
  }
  .note:hover { outline: 1px dashed rgba(37, 99, 235, .6); outline-offset: 2px; }
  .sheet[data-mode="pen"] .note, .sheet[data-mode="erase"] .note { pointer-events: none; }

  /* 팝업 */
  dialog {
    border: 0; border-radius: 16px; padding: 20px;
    width: min(420px, calc(100vw - 32px));
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog label { display: block; font-size: 14px; font-weight: 600; color: #5b6170; margin-bottom: 10px; }
  dialog input, dialog textarea {
    width: 100%; font: inherit; font-size: 17px; padding: 12px;
    border: 1.5px solid #d6d9df; border-radius: 10px; outline: 0; resize: vertical;
  }
  dialog input:focus, dialog textarea:focus { border-color: var(--ink); }
  dialog .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  dialog .row .grow { flex: 1; }
  dialog .opts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  dialog .btn { background: #eef0f3; }
  dialog .btn.primary { background: var(--ink); }
  dialog .btn.danger { background: #fdecec; }
  dialog .sw.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
  dialog .seg { background: #eef0f3; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(17,17,17,.88); color: #fff; font-size: 14px;
    padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 50;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="toolbar">
    <div class="hint" id="hint"></div>
    <button class="btn" id="resetBtn" type="button">초기화</button>
    <button class="btn primary" id="saveBtn" type="button">PNG 저장</button>
  </div>
  <div class="tools">
    <div class="seg" id="modes">
      <button type="button" data-mode="edit" class="on">기본</button>
      <button type="button" data-mode="pen">펜</button>
      <button type="button" data-mode="erase">지우개</button>
      <button type="button" data-mode="text">글자</button>
    </div>
    <div class="swatches" id="penColors"></div>
    <div class="seg" id="sizes">
      <button type="button" data-size="4">얇게</button>
      <button type="button" data-size="8" class="on">보통</button>
      <button type="button" data-size="16">굵게</button>
    </div>
    <button class="btn sm" id="undoBtn" type="button">되돌리기</button>
  </div>
</div>

<div class="wrap">
  <div class="sheet" id="sheet" data-mode="edit">
    <canvas id="bg"></canvas>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<dialog id="editor">
  <form method="dialog" id="edForm">
    <label id="edLabel" for="edInput"></label>
    <input id="edInput" maxlength="40" autocomplete="off">
    <div class="row">
      <span class="grow"></span>
      <button class="btn" type="button" id="edCancel">취소</button>
      <button class="btn primary" type="submit">확인</button>
    </div>
  </form>
</dialog>

<dialog id="noteDlg">
  <form method="dialog" id="noteForm">
    <label for="noteText">개인 멘트</label>
    <textarea id="noteText" rows="3" maxlength="200" placeholder="자유롭게 적어주세요 (줄바꿈 가능)"></textarea>
    <div class="opts">
      <div class="swatches" id="noteColors"></div>
      <div class="seg" id="noteSizes">
        <button type="button" data-size="28">작게</button>
        <button type="button" data-size="40">보통</button>
        <button type="button" data-size="56">크게</button>
      </div>
    </div>
    <div class="row">
      <button class="btn danger" type="button" id="noteDel">삭제</button>
      <span class="grow"></span>
      <button class="btn" type="button" id="noteCancel">취소</button>
      <button class="btn primary" type="submit">확인</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ---- 레이아웃 (원본 이미지 1568×2380 기준 좌표) ----
  const L = {
    W: 1568, H: 2380,
    cols: [211, 518, 825, 1132],
    rows: [469, 944, 1419, 1894],
    bw: 289, bh: 347, split: 288, lw: 3,
    labelX: 250, right: 1420,
  };
  const LABELS = ['눈감고도 가능함:', '무난하게 가능함:', '노력해야 가능함:', '인생 마지막 끌어치기:'];
  const COLORS = ['#111111', '#ffffff', '#e53935', '#ec407a', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
  const BG = '#f4f5f7', INK = '#111111';
  const F = 'Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const EXPORT_SCALE = 2; // 3136×4760 px
  const HINTS = {
    edit: '빈 칸을 눌러 이미지 추가 · 아래 칸에 이름 입력 · 넣은 글자는 끌어서 이동, 눌러서 수정',
    pen: '펜: 아무 데나 그리기 (휴대폰에서 스크롤은 기본 모드에서)',
    erase: '지우개: 그린 선만 지워져요',
    text: '글자: 원하는 위치를 눌러 멘트 넣기',
  };

  const $ = s => document.querySelector(s);
  const sheet = $('#sheet'), bgCanvas = $('#bg'), fileInput = $('#file');
  const cells = [], sections = [], secX = [];
  const strokes = [], notes = [], history = [];
  const u = n => `calc(var(--u) * ${n})`;
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: u(x), top: u(y), width: u(w), height: u(h) });
  const pos = i => ({ x: L.cols[i % 4], y: L.rows[Math.floor(i / 4)] });
  const narrow = () => sheet.clientWidth < 700;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let mode = 'edit', penColor = COLORS[2], penSize = 8;

  // ---- 그리기 ----
  function drawBase(ctx) {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, L.W, L.H);

    ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = `900 86px ${F}`;
    ctx.fillText('이런 캐 굴리기가', 211, 232);
    ctx.fillText('제일 쉬웠/어려웠어요', 211, 322);

    ctx.font = `500 22px ${F}`; ctx.textAlign = 'right';
    ctx.fillText('@Yami0i', 1419, 334);

    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(130, 478); ctx.lineTo(130, 2238);
    ctx.moveTo(112, 496); ctx.lineTo(130, 478); ctx.lineTo(148, 496);
    ctx.moveTo(112, 2220); ctx.lineTo(130, 2238); ctx.lineTo(148, 2220);
    ctx.stroke();

    ctx.font = `600 34px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    [['쉬움', 648], ['어려움', 2066]].forEach(([t, y]) => {
      ctx.lineWidth = 10; ctx.strokeStyle = BG; ctx.strokeText(t, 130, y);
      ctx.fillStyle = INK; ctx.fillText(t, 130, y);
    });

    L.rows.forEach((ry, r) => {
      const cy = ry - 41;
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(226, cy, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `800 19px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(r + 1), 226, cy + 1);
      ctx.fillStyle = INK; ctx.font = `600 35px ${F}`; ctx.textAlign = 'left';
      ctx.fillText(LABELS[r], L.labelX, cy + 1);
    });

    ctx.fillStyle = '#fff';
    for (let i = 0; i < 16; i++) { const { x, y } = pos(i); ctx.fillRect(x, y, L.bw, L.bh); }
  }

  function drawBorders(ctx) {
    ctx.strokeStyle = INK; ctx.lineWidth = L.lw; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    for (let i = 0; i < 16; i++) {
      const { x, y } = pos(i), h = L.lw / 2;
      ctx.strokeRect(x + h, y + h, L.bw - L.lw, L.bh - L.lw);
      ctx.beginPath(); ctx.moveTo(x, y + L.split); ctx.lineTo(x + L.bw, y + L.split); ctx.stroke();
    }
  }

  function drawCover(ctx, src, x, y, w, h) {
    const sw = src.width, sh = src.height, r = Math.max(w / sw, h / sh);
    const cw = w / r, ch = h / r;
    ctx.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, x, y, w, h);
  }

  function fitFont(ctx, text, weight, size, maxW, min = 12) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${F}`; if (ctx.measureText(text).width <= maxW) break; s -= 1; } while (s > min);
  }

  // 펜 선
  function styleStroke(ctx, s) {
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  function drawStroke(ctx, s) {
    styleStroke(ctx, s);
    const p = s.pts;
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    if (p.length === 1) ctx.lineTo(p[0][0] + 0.01, p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  function drawSeg(s, a, b) {
    styleStroke(inkCtx, s);
    inkCtx.beginPath(); inkCtx.moveTo(a[0], a[1]);
    inkCtx.lineTo(b[0] + (a === b ? 0.01 : 0), b[1]);
    inkCtx.stroke();
    inkCtx.globalCompositeOperation = 'source-over';
  }

  function drawNotes(ctx) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    notes.forEach(n => {
      ctx.font = `600 ${n.size}px ${F}`; ctx.fillStyle = n.color;
      const lh = n.size * 1.25;
      n.text.split('\n').forEach((line, i) => ctx.fillText(line, n.x, n.y + (i + 0.5) * lh));
    });
  }

  // ---- 미리보기 ----
  const ink = document.createElement('canvas');
  ink.id = 'ink';
  sheet.append(ink);
  const inkCtx = ink.getContext('2d');

  function drawPreview() {
    const w = sheet.clientWidth; if (!w) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = Math.round(w * dpr), ch = Math.round(w * L.H / L.W * dpr), s = cw / L.W;
    bgCanvas.width = cw; bgCanvas.height = ch;
    const ctx = bgCanvas.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    drawBase(ctx); drawBorders(ctx);
    ink.width = cw; ink.height = ch;
    renderInk();
  }
  function renderInk() {
    const s = ink.width / L.W;
    inkCtx.setTransform(1, 0, 0, 1, 0, 0);
    inkCtx.clearRect(0, 0, ink.width, ink.height);
    inkCtx.setTransform(s, 0, 0, s, 0, 0);
    strokes.forEach(st => drawStroke(inkCtx, st));
  }

  // ---- DOM 구성 ----
  L.rows.forEach((ry, r) => {
    const si = document.createElement('input');
    si.className = 'sec'; si.placeholder = '여기에 적기'; si.maxLength = 40;
    si.dataset.title = LABELS[r].replace(':', '');
    sheet.insertBefore(si, ink); sections.push(si);

    L.cols.forEach((cx) => {
      const zone = document.createElement('div');
      zone.className = 'photo';
      zone.innerHTML = '<img alt=""><span class="plus">+</span><button class="del" type="button" aria-label="이미지 삭제">×</button>';
      place(zone, cx + 3, ry + 3, L.bw - 6, L.split - 4.5);

      const name = document.createElement('input');
      name.className = 'name'; name.placeholder = '이름'; name.maxLength = 30;
      name.dataset.title = '캐릭터 이름';
      place(name, cx + 3, ry + L.split + 1.5, L.bw - 6, L.bh - L.split - 4.5);

      sheet.insertBefore(zone, ink); sheet.insertBefore(name, ink);
      const cell = { zone, name, img: null };
      cells.push(cell);

      zone.addEventListener('click', e => {
        if (e.target.closest('.del')) { e.stopPropagation(); setImg(cell, null); return; }
        current = cell; fileInput.click();
      });
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
      zone.addEventListener('drop', e => {
        e.preventDefault(); zone.classList.remove('drag');
        const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
        if (f) loadInto(cell, f);
      });
    });
  });

  function placeSections() {
    const c = document.createElement('canvas').getContext('2d');
    c.font = `600 35px ${F}`;
    sections.forEach((si, r) => {
      const cy = L.rows[r] - 41;
      const x = L.labelX + c.measureText(LABELS[r]).width + 12;
      secX[r] = x;
      place(si, x, cy - 25, L.right - x, 50);
    });
  }

  // ---- 툴바 ----
  function makeSwatches(box, get, set) {
    box.innerHTML = '';
    COLORS.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw'; b.style.background = c; b.dataset.c = c;
      b.setAttribute('aria-label', c);
      b.addEventListener('click', () => { set(c); paint(); });
      box.append(b);
    });
    const paint = () => box.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === get()));
    paint();
    return paint;
  }
  makeSwatches($('#penColors'), () => penColor, c => {
    penColor = c;
    if (mode !== 'pen' && mode !== 'text') setMode('pen');
  });

  function setMode(m) {
    mode = m; sheet.dataset.mode = m;
    $('#modes').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('#hint').textContent = HINTS[m];
  }
  $('#modes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
  $('#sizes').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    penSize = +b.dataset.size;
    $('#sizes').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  setMode('edit');

  function undo() {
    const h = history.pop(); if (!h) { toast('되돌릴 게 없어요'); return; }
    if (h.type === 'stroke') {
      const i = strokes.indexOf(h.ref); if (i >= 0) strokes.splice(i, 1);
      renderInk();
    } else if (h.type === 'note') {
      removeNote(h.ref);
    }
  }
  $('#undoBtn').addEventListener('click', undo);
  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault(); undo();
    }
  });

  // ---- 펜 / 지우개 ----
  const toUnits = e => {
    const r = sheet.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * L.W, (e.clientY - r.top) / r.height * L.H];
  };
  let cur = null;
  ink.addEventListener('pointerdown', e => {
    if (mode !== 'pen' && mode !== 'erase') return;
    e.preventDefault();
    ink.setPointerCapture(e.pointerId);
    const p = toUnits(e);
    cur = {
      pts: [p], erase: mode === 'erase',
      color: penColor, size: mode === 'erase' ? Math.max(24, penSize * 4) : penSize,
    };
    strokes.push(cur); history.push({ type: 'stroke', ref: cur });
    drawSeg(cur, p, p);
  });
  ink.addEventListener('pointermove', e => {
    if (!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = toUnits(ev), last = cur.pts[cur.pts.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 1) continue;
      cur.pts.push(p); drawSeg(cur, last, p);
    }
  });
  const endStroke = () => { cur = null; };
  ink.addEventListener('pointerup', endStroke);
  ink.addEventListener('pointercancel', endStroke);

  // ---- 자유 글자 ----
  ink.addEventListener('click', e => {
    if (mode !== 'text') return;
    const [x, y] = toUnits(e);
    openNote(null, x, y);
  });

  function renderNote(n) {
    if (!n.el) {
      n.el = document.createElement('div');
      n.el.className = 'note';
      sheet.append(n.el);
      bindNote(n);
    }
    Object.assign(n.el.style, { left: u(n.x), top: u(n.y), color: n.color, fontSize: u(n.size) });
    n.el.textContent = n.text;
  }
  function removeNote(n) {
    const i = notes.indexOf(n); if (i >= 0) notes.splice(i, 1);
    n.el?.remove(); n.el = null;
  }
  function bindNote(n) {
    let drag = null;
    n.el.addEventListener('pointerdown', e => {
      if (mode === 'pen' || mode === 'erase') return;
      e.preventDefault(); e.stopPropagation();
      n.el.setPointerCapture(e.pointerId);
      const r = sheet.getBoundingClientRect();
      drag = { sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, k: L.W / r.width, moved: false };
    });
    n.el.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 5) return;
      drag.moved = true;
      n.x = clamp(drag.ox + dx * drag.k, -20, L.W - 30);
      n.y = clamp(drag.oy + dy * drag.k, -20, L.H - 30);
      renderNote(n);
    });
    const up = () => { if (!drag) return; const moved = drag.moved; drag = null; if (!moved) openNote(n); };
    n.el.addEventListener('pointerup', up);
    n.el.addEventListener('pointercancel', () => { drag = null; });
    n.el.addEventListener('click', e => e.stopPropagation());
  }

  const noteDlg = $('#noteDlg'), noteText = $('#noteText');
  let noteTarget = null, noteNewPos = null, noteColor = COLORS[0], noteSize = 40;
  const paintNoteColors = makeSwatches($('#noteColors'), () => noteColor, c => { noteColor = c; });
  const paintNoteSizes = () => $('#noteSizes').querySelectorAll('button')
    .forEach(b => b.classList.toggle('on', +b.dataset.size === noteSize));
  $('#noteSizes').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    noteSize = +b.dataset.size; paintNoteSizes();
  });

  function openNote(n, x, y) {
    noteTarget = n;
    noteNewPos = n ? null : { x, y };
    noteText.value = n ? n.text : '';
    noteColor = n ? n.color : penColor;
    noteSize = n ? n.size : 40;
    paintNoteColors(); paintNoteSizes();
    $('#noteDel').style.visibility = n ? 'visible' : 'hidden';
    noteDlg.showModal();
    setTimeout(() => noteText.focus(), 50);
  }
  $('#noteForm').addEventListener('submit', () => {
    const text = noteText.value.replace(/\s+$/, '');
    if (noteTarget) {
      if (!text.trim()) removeNote(noteTarget);
      else { Object.assign(noteTarget, { text, color: noteColor, size: noteSize }); renderNote(noteTarget); }
    } else if (text.trim() && noteNewPos) {
      const n = {
        text, color: noteColor, size: noteSize,
        x: clamp(noteNewPos.x, 0, L.W - 30),
        y: clamp(noteNewPos.y - noteSize * 0.625, 0, L.H - 30),
      };
      notes.push(n); history.push({ type: 'note', ref: n });
      renderNote(n);
    }
    noteTarget = null; noteNewPos = null;
  });
  $('#noteCancel').addEventListener('click', () => { noteTarget = null; noteDlg.close(); });
  $('#noteDel').addEventListener('click', () => { if (noteTarget) removeNote(noteTarget); noteTarget = null; noteDlg.close(); });

  // ---- 이미지 ----
  let current = null;
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (f && current) loadInto(current, f);
    fileInput.value = '';
  });

  function loadInto(cell, file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const MAX = 1600, r = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * r));
      c.height = Math.max(1, Math.round(img.naturalHeight * r));
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      setImg(cell, c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('이미지를 열 수 없어요'); };
    img.src = url;
  }

  function setImg(cell, c) {
    cell.img = c;
    const el = cell.zone.querySelector('img');
    el.src = c ? c.toDataURL('image/jpeg', 0.9) : '';
    cell.zone.classList.toggle('has', !!c);
  }

  // ---- 좁은 화면: 팝업으로 입력 ----
  const editor = $('#editor'), edInput = $('#edInput'), edLabel = $('#edLabel');
  let editing = null;
  const allInputs = () => [...sections, ...cells.map(c => c.name)];

  function syncReadonly() { const n = narrow(); allInputs().forEach(i => { i.readOnly = n; }); }

  allInputs().forEach(inp => inp.addEventListener('click', () => {
    if (!inp.readOnly) return;
    editing = inp;
    edLabel.textContent = inp.dataset.title;
    edInput.value = inp.value;
    edInput.maxLength = inp.maxLength;
    editor.showModal();
    setTimeout(() => edInput.focus(), 50);
  }));
  $('#edForm').addEventListener('submit', () => { if (editing) editing.value = edInput.value; editing = null; });
  $('#edCancel').addEventListener('click', () => { editing = null; editor.close(); });

  // ---- PNG 저장 ----
  const saveBtn = $('#saveBtn');
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    try {
      await fontsReady;
      const S = EXPORT_SCALE, cv = document.createElement('canvas');
      cv.width = L.W * S; cv.height = L.H * S;
      const ctx = cv.getContext('2d');
      ctx.scale(S, S);
      ctx.imageSmoothingQuality = 'high';
      drawBase(ctx);
      cells.forEach((cell, i) => {
        if (!cell.img) return;
        const { x, y } = pos(i);
        drawCover(ctx, cell.img, x + 3, y + 3, L.bw - 6, L.split - 4.5);
      });
      drawBorders(ctx);

      ctx.fillStyle = INK; ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      cells.forEach((cell, i) => {
        const t = cell.name.value.trim(); if (!t) return;
        const { x, y } = pos(i);
        fitFont(ctx, t, 500, 26, L.bw - 20);
        ctx.fillText(t, x + L.bw / 2, y + L.split + (L.bh - L.split) / 2 + 1);
      });
      ctx.textAlign = 'left';
      sections.forEach((si, r) => {
        const t = si.value.trim(); if (!t) return;
        fitFont(ctx, t, 500, 32, L.right - secX[r]);
        ctx.fillText(t, secX[r], L.rows[r] - 41 + 1);
      });

      if (strokes.length) {
        const layer = document.createElement('canvas');
        layer.width = cv.width; layer.height = cv.height;
        const lctx = layer.getContext('2d');
        lctx.scale(S, S);
        strokes.forEach(st => drawStroke(lctx, st));
        ctx.drawImage(layer, 0, 0, L.W, L.H);
        layer.width = layer.height = 0;
      }
      drawNotes(ctx);

      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      cv.width = cv.height = 0;
      const fname = '캐굴리기_난이도표.png';
      const file = new File([blob], fname, { type: 'image/png' });
      const touch = matchMedia('(pointer: coarse)').matches;

      if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('저장했어요');
    } catch (e) {
      console.error(e); toast('저장 중 문제가 생겼어요');
    } finally {
      saveBtn.disabled = false;
    }
  });

  $('#resetBtn').addEventListener('click', () => {
    if (!confirm('이미지, 글, 그림을 모두 지울까요?')) return;
    cells.forEach(c => { setImg(c, null); c.name.value = ''; });
    sections.forEach(s => s.value = '');
    strokes.length = 0; history.length = 0;
    [...notes].forEach(removeNote);
    renderInk();
  });

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---- 시작 ----
  const fontsReady = Promise.all(
    ['900 86px', '800 19px', '600 35px', '600 34px', '600 40px', '500 32px', '500 26px', '500 22px']
      .map(f => document.fonts.load(`${f} Pretendard`))
  ).catch(() => {});

  placeSections(); drawPreview(); syncReadonly();
  fontsReady.then(() => { placeSections(); drawPreview(); });
  new ResizeObserver(() => { drawPreview(); syncReadonly(); }).observe(sheet);
})();
</script>
</body>
</html>
